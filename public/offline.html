<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Analytics Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .offline-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      color: #6b7280;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="offline-container">
    <svg 
      class="offline-icon" 
      xmlns="http://www.w3.org/2000/svg" 
      fill="none" 
      viewBox="0 0 24 24" 
      stroke="currentColor"
    >
      <path 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-width="2" 
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">You're currently offline</h1>
    <p class="text-gray-600 mb-6 max-w-md">
      It seems you're not connected to the internet. Some features may not be available. 
      Please check your connection and try again.
    </p>
    <button 
      onclick="window.location.reload()" 
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      Retry Connection
    </button>
    <div class="mt-8 text-sm text-gray-500">
      <p>While offline, you can still access previously loaded content.</p>
    </div>
  </div>

  <script>
    // Check if we're back online
    function updateOnlineStatus() {
      if (navigator.onLine) {
        window.location.href = '/';
      }
    }

    // Listen for online/offline status changes
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', () => {});
  </script>
</body>
</html>
